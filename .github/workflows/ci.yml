name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm

      - name: Setup npm
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test with coverage thresholds
        run: npm run test:coverage

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser checks
        # Check emitted assets as served by preview, not Vite's development transforms.
        run: |
          npm run preview -- --host 127.0.0.1 --strictPort > /tmp/vite-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill $preview_pid' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          node scripts/check-frontend.mjs
